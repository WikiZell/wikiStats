; WikiStats / FleetPanel ESP32 panel firmware
;
; Target: ESP32-2432S028R "Cheap Yellow Display"
;   ESP32-WROOM-32 (no PSRAM), 4 MB flash
;   320x240 ILI9341 on HSPI, XPT2046 resistive touch on VSPI
;
; Every dependency below is pinned to an exact version. Floating ranges on an
; embedded target turn a working build into a broken one without a code change.

[platformio]
default_envs = cyd
src_dir = src
lib_dir = lib
include_dir = include
test_dir = test
data_dir = data

; ---------------------------------------------------------------- shared

[common]
; Firmware version is compiled in and shown on the diagnostics page, reported by
; GET /api/status, and used by the OTA flow.
version = 0.1.0

build_flags_core =
    -D FP_FIRMWARE_VERSION=\"${common.version}\"
    -D FP_PRODUCT_NAME=\"WikiStats\"
    -D FP_TELEMETRY_SCHEMA=\"fleetpanel.telemetry.v1\"
    -D FP_MDNS_SERVICE=\"fleetpanel\"
    -D FP_MQTT_BASE_TOPIC=\"fleetpanel/v1\"

; ------------------------------------------------------- ESP32 CYD target

[env:cyd]
platform = espressif32 @ 6.7.0        ; Arduino-ESP32 2.0.17, IDF 4.4.7
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = partitions_wikistats.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

lib_ldf_mode = deep+
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    lvgl/lvgl @ 8.3.11
    bblanchon/ArduinoJson @ 7.2.1
    knolleary/PubSubClient @ 2.8
    esp32async/AsyncTCP @ 3.5.0
    esp32async/ESPAsyncWebServer @ 3.12.0
    ; The PlatformIO registry only carries an untagged snapshot of this library, so
    ; it is pinned to the upstream release tag instead of a registry version.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_unflags = -std=gnu++11

build_flags =
    ${common.build_flags_core}
    -std=gnu++17
    ; The Arduino core's own logging is off: this project has its own logger which
    ; also reaches the Wi-Fi console and the web UI, and the core's log strings cost
    ; ~40 KiB of a 1856 KiB application partition.
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUHAL_LOG_COLORS=0

    ; ---- async web server ----
    ; Regex routes are needed for PUT/DELETE /api/devices/<id>.
    -D ASYNCWEBSERVER_REGEX=1

    ; ---- LVGL ----
    ; LV_CONF_INCLUDE_SIMPLE makes LVGL do  #include "lv_conf.h"  which resolves
    ; through the include path below, so the config lives with the project rather
    ; than inside the library directory.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I src

    ; ---- TFT_eSPI for the ESP32-2432S028R ----
    ; Supplied here instead of editing User_Setup.h so a clean checkout builds.
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1        ; the CYD panel needs the alternative init sequence
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1                ; panel reset is tied to the ESP32 EN line
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D USE_HSPI_PORT=1

    ; ---- Panel hardware map (consumed by src/hal) ----
    ; Touch is a *separate* SPI bus on the CYD, which is why TFT_eSPI's built-in
    ; touch support is not used.
    -D FP_TOUCH_SPI_HOST=VSPI
    -D FP_TOUCH_CLK=25
    -D FP_TOUCH_MOSI=32
    -D FP_TOUCH_MISO=39
    -D FP_TOUCH_CS=33
    -D FP_TOUCH_IRQ=36
    -D FP_LED_R=4
    -D FP_LED_G=16
    -D FP_LED_B=17
    -D FP_LDR_PIN=34
    -D FP_BACKLIGHT_PIN=21
    -D FP_BACKLIGHT_PWM_CHANNEL=7

; Over-the-air upload. After the first USB flash:
;   pio run -e cyd-ota -t upload --upload-port wikistats.local
[env:cyd-ota]
extends = env:cyd
upload_protocol = espota
upload_port = wikistats.local
; The OTA password is the web admin password; pass it on the command line:
;   pio run -e cyd-ota -t upload --upload-port wikistats.local --upload-flags --auth=SECRET

; ---------------------------------------------- host tests (no hardware)

[env:native]
platform = native
test_framework = unity
; fleet_core is deliberately free of Arduino headers so the parsing, formatting,
; threshold, gesture, carousel, dedup and migration logic can be tested on a PC.
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
build_flags =
    ${common.build_flags_core}
    -std=gnu++17
    -D FP_NATIVE_BUILD=1
    ; Network rates are doubles in the protocol; without this Unity refuses
    ; TEST_ASSERT_DOUBLE_WITHIN instead of comparing.
    -D UNITY_INCLUDE_DOUBLE
    -I lib/fleet_core
build_src_filter = -<*>
test_build_src = no
